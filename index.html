<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notgre3Nz AI — Account</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}body{margin:0;background:#171717;color:#f4f4f4;min-height:100vh}header{padding:22px 28px;border-bottom:1px solid #303030;font-weight:650}main{max-width:420px;margin:9vh auto;padding:0 20px}h1{font-size:29px;letter-spacing:-.8px;margin-bottom:8px}p{color:#aaa;line-height:1.5}.panel{margin-top:30px}label{display:block;font-size:13px;margin:18px 0 7px}input{width:100%;padding:14px;background:#242424;color:white;border:1px solid #484848;border-radius:11px;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}input:focus{border-color:#ddd;box-shadow:0 0 0 3px #ffffff18}button{font:inherit;cursor:pointer;transition:background .2s,transform .15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait}#submit{width:100%;margin-top:22px;padding:13px;background:#eee;color:#181818;border:0;border-radius:11px;font-weight:650}#submit:hover{background:#ccc}.link{background:none;border:0;color:#eee;text-decoration:underline;padding:5px}#status{min-height:30px;font-size:14px;overflow-wrap:anywhere}#account{display:none;padding-top:20px}.danger{color:#ff9f9f}.success{color:#9fe7b0}small{color:#999}a{color:#ddd}
</style>
</head>
<body><header>Notgre3Nz AI</header><main>
<section id="auth"><h1 id="heading">Welkom terug</h1><p id="subtitle">Log in op je account.</p><form id="form" class="panel"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="email" required maxlength="254"><label for="password">Wachtwoord</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="current-password" required><button id="submit" type="submit">Inloggen</button></form><p><button class="link" id="switch" type="button">Nog geen account? Registreren</button></p></section>
<section id="account"><h1>Je bent ingelogd</h1><p id="who"></p><p>Je account werkt! De AI-chat koppelen we later veilig aan deze sessie.</p><button id="logout" type="button">Uitloggen</button></section>
<p id="status" role="status" aria-live="polite"></p><small>Deel nooit je wachtwoord. Gebruik voor deze demo geen schoolwachtwoord.</small>
</main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
// Vul ALLEEN de publieke Project URL en publishable/anon key in.
// Zet NOOIT een service_role of secret key in GitHub Pages.
const SUPABASE_URL = 'https://xgaxctewxrughtrxclwc.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_li43rQEK13HfVACbiGC_-w_mVpvQfxQ';
const status = document.querySelector('#status');
const submit = document.querySelector('#submit');
const password = document.querySelector('#password');
let register = false;
const configured = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('VUL_HIER') && !SUPABASE_PUBLISHABLE_KEY.includes('VUL_HIER');
const supabase = configured ? createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY) : null;
function message(text, error=false){status.textContent=text;status.className=error?'danger':'success'}
function showSession(session){const signedIn=!!session?.user;document.querySelector('#auth').style.display=signedIn?'none':'block';document.querySelector('#account').style.display=signedIn?'block':'none';document.querySelector('#who').textContent=signedIn?`Ingelogd als ${session.user.email}`:'';}
document.querySelector('#switch').onclick=()=>{register=!register;document.querySelector('#heading').textContent=register?'Maak een account':'Welkom terug';document.querySelector('#subtitle').textContent=register?'Registreer met je e-mailadres.':'Log in op je account.';submit.textContent=register?'Registreren':'Inloggen';document.querySelector('#switch').textContent=register?'Al een account? Inloggen':'Nog geen account? Registreren';password.autocomplete=register?'new-password':'current-password';message('');};
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();if(!supabase){message('Stel eerst de Supabase-projectgegevens in de code in.',true);return;}submit.disabled=true;message('Even wachten...');const email=document.querySelector('#email').value.trim();const pass=password.value;try{const result=register?await supabase.auth.signUp({email,password:pass}):await supabase.auth.signInWithPassword({email,password:pass});if(result.error)throw result.error;password.value='';if(register)message('Registratie ontvangen. Controleer je e-mail voor de bevestigingslink (als e-mailbevestiging aanstaat).');else message('Ingelogd!');if(result.data.session)showSession(result.data.session);}catch(err){message(err.message||'Er ging iets mis.',true)}finally{submit.disabled=false;}};
document.querySelector('#logout').onclick=async()=>{if(!supabase)return;const {error}=await supabase.auth.signOut();if(error)message(error.message,true);else{showSession(null);message('Je bent uitgelogd.')}};
if(supabase){supabase.auth.getSession().then(({data,error})=>{if(error)message(error.message,true);else showSession(data.session)});supabase.auth.onAuthStateChange((_event,session)=>showSession(session));}else message('Demo-modus: voeg je publieke Supabase-projectgegevens toe om accounts te activeren.',true);
</script></body></html>
